[project]
name = "climate-information"
version = "0.1.0"
description = "Climate Information Data Model"
authors = [{ name = "IBPSA-USA" }]
requires-python = "~=3.10"
dependencies = ["lattice",
                "pyyaml>=6.0.1"]

[dependency-groups]
dev = [
    "doit==0.36.0",
    "tomli==2.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climate-information"]

[tool.uv.sources]
lattice = { git = "https://github.com/bigladder/lattice.git", branch = "climate-info-update" }
