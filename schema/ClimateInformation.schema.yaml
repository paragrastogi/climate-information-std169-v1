Schema:
  Object Type: "Meta"
  Title: "Climate Information"
  Description: "Schema for describing climate information"
  Version: "0.2.0"
  Root Data Group: "ClimateInformation"
  Unit Systems:
    ClimateUnits:
      - h
      - degrees

SchemaType:
  Object Type: "Enumeration"
  Enumerators:
    CLIMATE_INFORMATION:
      Description: "Climate information"

# TODO: Add more enumerators for SUMMARY data source type, e.g., "measured", "modeled", "reanalysis", "assumption", etc. Rename this to TimeSeries Data Type.
TimeSeriesDataSourceType:
  Object Type: "Enumeration"
  Enumerators:
    DIRECT_MEASUREMENT:
      Description: "Direct Measurement"
      Display Text: "Direct Measurement"
    DERIVED_MEASUREMENT:
      Description: "Derived Measurement"
      Display Text: "Derived Measurement"
    MODELED:
      Description: "Modeled"
      Display Text: "Modeled"
    INTERPOLATED:
      Description: "Interpolated"
      Display Text: "Interpolated"
    ASSUMPTION:
      Description: "Assumption"
      Display Text: "Assumption"
    UNKNOWN:
      Description: "Unknown"
      Display Text: "Unknown"

TimeSeriesType:
  Object Type: "Enumeration"
  Enumerators:
    INSTANTANEOUS:
      Description: "Instantaneous"
      Notes: "Values reflect the instant of the current timestamp in the corresponding TimeInterval data group"
    AVERAGE:
      Description: "Average"
      Notes: "Values reflect the average between the previous timestamp and the current timestamp in the corresponding TimeInterval data group"
    SUM:
      Description: "Sum"
      Notes: "Values reflect the integrated sum between the previous timestamp and the current timestamp in the corresponding TimeInterval data group"
    CUMULATIVE:
      Description: "Cumulative"
      Notes: "Values reflect the cumulative sum between the starting timestamp and the current timestamp in the corresponding TimeInterval data group"

SummaryDataSourceType:
  Object Type: "Enumeration"
  Enumerators:
    MEASURED:
      Description: "Data measured from weather stations or other observational sources near the surface of the Earth. This would normally not include satellite data."
      Display Text: "Measured"
    MODELED:
      Description: "Modeled climate data from a numerical model of the global climate system that provide estimates of weather data. These could be future projections, historical reconstructions, or other types of estimates."
      Display Text: "Modeled"

TimeSeriesClimateDataType:
  Object Type: "Enumeration"
  Enumerators:
    MEASURED:
      Description: "Measured climate data"
    TYPICAL:
      Description: "Typical climate data composed of either measured or modeled data, or both"
    REANALYSIS:
      Description: "Climate data from atmospheric reanalysis models used to provide weather and climatic data for historical periods worldwide"
    FORECAST:
      Description: "Climate data from numerical weather forecast models used to provide short term forecasts of weather conditions"
    PROJECTED:
      Description: "Projected climate data from a numerical model of the global climate system that provide estimates of future weather data driven by meteorological and human factors"

ClimateInformation:
  Object Type: "Data Group"
  Data Elements:
    metadata:
      Description: "Metadata"
      Type: "Group(Metadata)"
      Constraints: schema_name="CLIMATE_INFORMATION"
      Required: True
    location:
      Description: "Location data group"
      Type: "Group(Location)"
      Required: True
    time_series_data_sets:
      Description: "An array of time series climate data sets for this location"
      Type: "Array(Group(TimeSeriesDataSet))"
      Constraints:
      - "[1..]"
    summary_data_sets:
      Description: "An array of summary climate data sets for this location"
      Type: "Array(Group(SummaryDataSet))"
      Constraints:
      - "[1..]"

ClimateZone:
  Object Type: "Data Group"
  Data Elements:
    system:
      Type: String
      Description: "Climate zone classification system"
      Required: True
    system_version:
      Type: String
      Description: "Version of the climate zone classification system"
      Required: True
    source_data_set:
      Type: String
      Description: "Informative notes on the data set used to determine climate zone"
    zone:
      Type: String
      Description: "Climate zone within the classification system"
      Required: True
    notes: 
      Type: String
      Description: "Informative notes about the climate zone classification"
    

Location:
  Object Type: "Data Group"
  Unit System: ClimateUnits
  Data Elements:
    name:
      Type: String
      Description: "Descriptive name of the weather station location"
      Notes: "Suggest including human-readable identifiers of location, e.g., country, state"
      Required: True
    country_code:
      Type: String
      Description: "Country"
      Notes: "ISO Alpha-3 country code"
      Required: True
    subdivision:
      Type: String
      Description: "Administrative subdivision within a country"
      Notes: "State, province, or other identified region"
    postal_code:
      Type: String
      Description: "Postal code"
    wmo_station_id:
      Type: String
      Description: "World Meteorological Organization Station Number"
      Notes: "World Meteorological Organization Station Number"
    wmo_station_class:
      Type: Integer
      # TODO: Confirm enumeration of WMO station classes, and whether this should be an enumeration or integer.
      Constraints: ">=1, <=5"
      Description: "World Meteorological Organization Station Class"
      Notes: "World Meteorological Organization Station Class, 1-3 for surface stations, 4 for upper air stations, 5 for ship-based stations, 6 for buoy-based stations, 7 for other platforms."
    wigos_station_id:
    # TODO: Add patterns for WIGOS, WBAN, IATA, and ICAO station identifiers. For WIGOS, see https://oscar.wmo.int/surface/index.html. For WBAN, see https://www.ncei.noaa.gov/data/global-hourly/doc/wban-station-ids.pdf. For IATA, see https://en.wikipedia.org/wiki/List_of_airports_by_IATA_code:_A. For ICAO, see https://en.wikipedia.org/wiki/List_of_airports_by_ICAO_code:_A.
      Type: String
      Description: "WIGOS Station Identifier"
      Notes: "WMO Integrated Global Observing System, [https://oscar.wmo.int/surface/index.html](https://oscar.wmo.int/surface/index.html)"
    wban_station_number:
      Type: String
      Description: "Weather Bureau Army Navy Number"
    iata_station_id:
      Type: String
      Description: "International Air Transport Association Station Identifier"
    icao_station_id:
      Type: String
      Description: "International Civil Aviation Organization Station Identifier"
    maslib_catalog_number:
      Type: String
      Description: "Master Station Library Catalog Number"
    latitude:
      Constraints: ">=-90.0, <=90.0"
      Type: Numeric
      Description: "Latitude relative to the equator"
      Notes: "+ is North, - is South"
      Required: True
      Units: "degrees"
    longitude:
      Constraints: ">=-180.0, <=180.0"
      Type: Numeric
      Description: "Longitude relative to prime meridian"
      Notes: "+ is East, - is West"
      Required: True
      Units: "degrees"
    time_zone_offset:
      Constraints: ">=-12.0, <=14.0"
      Type: Numeric
      Description: "Time zone offset relative to UTC at time of dataset creation"
      Required: True
      Units: "h"
    iana_time_zone_code:
      Type: String # TODO: Make this an enumeration of valid IANA time zone codes, not free-form string. https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      Description: "IANA time zone code"
      Required: True
    elevation:
      Type: Numeric
      Description: "Station elevation relative to sea level (bottom of station)"
      Required: True
      Units: "m"
    anemometer_height:
      Constraints: ">0.0"
      Type: Numeric
      Description: "Height of anemometer above the ground"
      Notes: "Typically 10 m (potentially move to Time Series Source for Wind Speed/Direction)"
      Required: True
      Units: "m"
    station_height:
      Constraints: ">0.0"
      Type: Numeric
      Description: "Height of other meteorological measurements above the ground"
      Notes: "Typically 1.8 m"
      Required: True
      Units: "m"
    notes:
      Type: String
      Description: "Notes"
    climate_zones:
      Type: "Array(Group(ClimateZone))"
      Description: "Climate zones for this location"
      Notes: "Climate zone object refers to list of climate zone classifications that are applicable to this location _only_, not necessarily applicable to a \"nearby\" site"
    quality_flags:
      Type: "Array(String)"
      Description: "Quality flags for this location"
      Notes: ["User-defined quality flags for this location", "Not intended to be a comprehensive list of all quality flags that may be relevant to this location, but rather a user-defined list of important quality flags that may be referenced in the TimeSeries data groups within the TimeSeriesDataSet data group(s)"]

SourceDataPeriod:
  Object Type: "Data Group"
  Data Elements:
    id:
      ID: True
      Type: String
      Description: Reference id
      Required: True
    starting_time:
      Type: Timestamp
      Description: Starting time of source data period
      Required: True
    ending_time:
      Type: Timestamp
      Description: Ending time of source data period
      Required: True
    notes:
      Type: String
      Description: Notes about this source data period
    ashrae_grade:
      Type: String
      Constraints: '["A", "B", "C", "D", "E"]'
      Description: ASHRAE grade of source data period based on ASHRAE Handbook - Fundamentals 2025 criteria for grade A-E

SummaryDataSet:
  Object Type: "Data Group"
  Data Elements:
    climate_data_type:
      Type: Enumeration(SummaryClimateDataType)
      Description: Type of summary climate data
      Required: True
    source_data_periods:
      Type: "Array(Group(SourceDataPeriod))"
      Description: Array of SourceDataPeriod data groups describing the time periods of the source data used to create this summary dataset
      Required: True
    summary_data:
      Type: "Group(ClimateSummaryData)"
      Description: Data group containing named summary data elements
      Required: True
    notes:
      Type: String
      Description: Supplementary information about this dataset
    

TimeSeriesDataSet:
  Object Type: Data Group
  Data Elements:
    climate_data_type:
      Type: Enumeration(TimeSeriesClimateDataType)
      Description: Type of climate data
      Required: True
    time_intervals:
      Type: "Array(Group(TimeInterval))"
      Description: Array of TimeInterval data groups whose ids may be referenced within TimeSeries data groups
      Required: True
    time_series:
      Type: "Group(ClimateTimeSeries)"
      Description: Data group containing named TimeSeries data elements
      Required: True
    notes:
      Type: String
      Description: Supplementary information about this dataset

TimeInterval:
  Object Type: "Data Group"
  Data Elements:
    id:
      ID: True
      Type: String
      Description: Reference id
      Required: True
    starting_time:
      Description: Beginning of data
      Type: Timestamp
      Required: False
      Notes: Used to determine the "previous" timestamp for the first value in a time
        series where the time series is not instantaneous
    regular_interval:
      Description: Duration of regular intervals
      Type: Numeric
      Units: s
      Constraints: ">0"
      Required: if !timestamps
    timestamps:
      Description: Array of timestamps
      Type: "Array(Timestamp)"
      Constraints: "[1..]"
      Required: if !regular_interval
    labels:
      Description: Informal labels describing each time interval
      Type: "Array(String)"
      Constraints: "[1..]"
      Notes: e.g., Month names for monthly intervals
    notes:
      Description: Notes about each time interval
      Type: "Array(String)"
      Constraints: "[1..]"

# TODO: Constraints the way they are written now may be redundant.
ClimateSummaryData:
  Object Type: "Data Group"
  Data Elements:
    dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature"
      - units="K"
      - values.Constraints=">0"
      # For all numerical values below, this constraint must apply. What is the syntax for such an instruction?
      # Enumerating every instance/statistics is potentially redundant and too verbose, since the same could be achieved by taking a "join" of the constraints on the individual statistical elements. E.g., all statistics for dry-bulb temperature should have the unit "K" and values ">0", *unless* otherwise defined for a specific statistic, e.g., return period or variance.
      # - annual.mean.Constraints=">0"
      # - annual.mean.Units="K"
      # - monthly.mean.Constraints=">0"
      # - monthly.mean.Units="K"
      # - annual.standard_deviation.Constraints=">=0"
      # - annual.standard_deviation.Units="K"
      Description: Dry-bulb temperature
    dew_point_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dew-point temperature"
      - units="K"
      - values.Constraints=">0"
      Description: Dew-point temperature
    relative_humidity:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Relative humidity"
      - units="-"
      - values.Constraints=">=0, <=1"
      Description: Relative humidity
    dry_bulb_temperature_coincident_mean_wet_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with mean wet-bulb temperature"
      - units="K"
      - values.Constraints=">0"
      Description: Dry-bulb temperature coincident with mean wet-bulb temperature
    dry_bulb_temperature_coincident_mean_wind_speed:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with mean wind speed"
      - units="K"
      - values.Constraints=">0"
      Description: Dry-bulb temperature coincident with mean wind speed
    daily_average_dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Daily average dry-bulb temperature"
      - units="K"
      - values.Constraints=">0"
      Description: Daily average dry-bulb temperature
      Notes: This is the sum of the daily minimum and maximum temperatures divided by 2. Generally used to estimate monthly degree days.
      

ClimateTimeSeries:
  Object Type: Data Group
  Data Elements:
    dry_bulb_temperature:
      Type: "Group(TimeSeries)"
      Constraints:
      - display_name="Dry-bulb temperature"
      - units="K"
      - value_type=INSTANTANEOUS
      - values.Constraints=">0"
      Description: Dry-bulb temperature
    dew_point_temperature:
      Constraints:
      - display_name="Dew-point temperature"
      - units="K"
      - value_type=INSTANTANEOUS
      - values.Constraints=">0"
      Type: "Group(TimeSeries)"
      Description: Dew-point temperature
    relative_humidity:
      Constraints:
      - display_name="Relative humidity"
      - units="-"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0, <=1"
      Type: "Group(TimeSeries)"
      Description: Relative humidity
    wet_bulb_temperature:
      Constraints:
      - display_name="Wet-bulb temperature"
      - units="K"
      - value_type=INSTANTANEOUS
      - values.Constraints=">0"
      Type: "Group(TimeSeries)"
      Description: Wet-bulb temperature
    humidity_ratio:
      Constraints:
      - display_name="Humidity Ratio"
      - units="-"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0, <=1"
      Type: "Group(TimeSeries)"
      Description: Humidity Ratio
    atmospheric_pressure:
      Constraints:
      - display_name="Atmospheric pressure"
      - units="Pa"
      - value_type=INSTANTANEOUS
      - values.Constraints=">0"
      Type: "Group(TimeSeries)"
      Description: Atmospheric pressure
    global_horizontal_irradiance:
      Constraints:
      - display_name="Global solar horizontal irradiance (Instantaneous, Power)"
      - units="W/m2"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Global solar horizontal irradiance (Instantaneous, Power)
      Notes: Instantaneous irradiation received on a horizontal detector.
    direct_normal_irradiance:
      Constraints:
      - display_name="Direct normal solar irradiance (Instantaneous, Power)"
      - units="W/m2"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Direct normal solar irradiance (Instantaneous, Power)
    diffuse_horizontal_irradiance:
      Constraints:
      - display_name="Diffuse horizontal irradiance (Instantaneous, Power)"
      - units="W/m2"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Diffuse horizontal irradiance (Instantaneous, Power)
    global_horizontal_irradiation:
      Constraints:
      - display_name="Global solar horizontal irradiation (Sum, Energy)"
      - units="J/m2"
      - value_type=SUM
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Global solar horizontal irradiation (Sum, Energy)
      Notes: This quantity is technically insolation, i.e., irradiance from the sun on
        a horizontal detector integrated over time.
    direct_normal_irradiation:
      Constraints:
      - display_name="Direct normal solar irradiation (Sum, Energy)"
      - units="J/m2"
      - value_type=SUM
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Direct normal solar irradiation (Sum, Energy)
    diffuse_horizontal_irradiation:
      Constraints:
      - display_name="Diffuse horizontal irradiation (Sum, Energy)"
      - units="J/m2"
      - value_type=SUM
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Diffuse horizontal irradiation (Sum, Energy)
    horizontal_infrared_sky_irradiance:
      Constraints:
      - display_name="Horizontal infrared sky irradiance (Instantaneous, Power)"
      - units="W/m2"
      - value_type=INSTANTANEOUS
      - values.Constraints=">0"
      Type: "Group(TimeSeries)"
      Description: Horizontal infrared sky irradiance (Instantaneous, Power)
      Notes: Integrated power at each wavelength between 3 um and 100 um at an instant
        in time, received on a horizontal detector. Downward flux only. Metadata for this
        variable should declare whether this quantity is modelled, including which model
        was used, or whether it is measured. If it is measured, the detector"s range should
        be declared if different from nominal as defined for this variable.
    total_sky_cover:
      Constraints:
      - display_name="Total sky cover"
      - units="-"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0, <=1"
      Type: "Group(TimeSeries)"
      Description: Total sky cover
      Notes: Fraction of sky dome covered by clouds or obscuring phenomena. Usually measured
        in eights or tenths.
    opaque_sky_cover:
      Constraints:
      - display_name="Opaque sky cover"
      - units="-"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0, <=1"
      Type: "Group(TimeSeries)"
      Description: Opaque sky cover
      Notes: Fraction of sky dome covered by opaque clouds or obscuring phenomena. Usually
        measured in eights or tenths.
    precipitable_water:
      Constraints:
      - display_name="Precipitable water"
      - units="m"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Precipitable water
      Notes: Total amount of water in a column of unit area from the elevation of the
        station to the upper troposphere. Includes clouds.
    aerosol_optical_depth:
      Constraints:
      - display_name="Aerosol optical depth"
      - units="-"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Aerosol optical depth
      Notes: Extinction coefficient for a collimated beam traveling through the atmosphere,
        denoting the extinction of a beam as it traverses the atmosphere. The natural
        log of the ratio of incident to transmitted radiant power. Described using Beer"s
        law (transmission, scattering, and absorption).
    global_horizontal_illuminance:
      Constraints:
      - display_name="Global horizontal illuminance"
      - units="lx"
      - value_type=AVERAGE
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Global horizontal illuminance
    direct_normal_illuminance:
      Constraints:
      - display_name="Direct normal illuminance"
      - units="lx"
      - value_type=AVERAGE
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Direct normal illuminance
    diffuse_horizontal_illuminance:
      Constraints:
      - display_name="Diffuse horizontal illuminance"
      - units="lx"
      - value_type=AVERAGE
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Diffuse horizontal illuminance
    wind_direction:
      Constraints:
      - display_name="Wind direction"
      - units="radians"
      - value_type=INSTANTANEOUS
      Type: "Group(TimeSeries)"
      Description: Wind direction
      Notes: Clockwise from north
    wind_speed:
      Constraints:
      - display_name="Wind speed"
      - units="m/s"
      - value_type=INSTANTANEOUS
      Type: "Group(TimeSeries)"
      Description: Wind speed
      Notes: Instantaneous wind speed at the time stamp. Wind speed is measured at 10m
        as standard, anything else must be included in metadata.
    snow_depth:
      Constraints:
      - display_name="Snow depth"
      - units="m"
      - value_type=INSTANTANEOUS
      Type: "Group(TimeSeries)"
      Description: Snow depth
      Notes: Current observed depth of snow on the ground.
    albedo:
      Constraints:
      - display_name="Albedo"
      - units="-"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0, <=1"
      Type: "Group(TimeSeries)"
      Description: Albedo
    liquid_precipitation_depth:
      Constraints:
      - display_name="Liquid precipitation depth"
      - units="m"
      - value_type=SUM
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Liquid precipitation depth
      Notes: The cumulative depth of precipitation in the past time step.
    particulate_matter_01_0:
      Constraints:
      - display_name="Particulate Matter 1.0"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Particulate Matter 1.0
      Notes: "PM1.0: Mass of particles of size less than or equal to 1 um (micrometer)
        in one cubic meter of air."
    particulate_matter_02_5:
      Constraints:
      - display_name="Particulate Matter 2.5"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Particulate Matter 2.5
      Notes: "PM2.5: Mass of particles of size less than or equal to 2.5 um (micrometer)
        in one cubic meter of air."
    particulate_matter_04_0:
      Constraints:
      - display_name="Particulate Matter 4.0"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Particulate Matter 4.0
      Notes: "PM4.0: Mass of particles of size less than or equal to 4.0 um (micrometer)
        in one cubic meter of air."
    particulate_matter_05_0:
      Constraints:
      - display_name="Particulate Matter 5.0"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Particulate Matter 5.0
      Notes: "PM5.0: Mass of particles of size less than or equal to 5.0 um (micrometer)
        in one cubic meter of air."
    particulate_matter_10_0:
      Constraints:
      - display_name="Particulate Matter 10.0"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Particulate Matter 10.0
      Notes: "PM10: Mass of particles of size less than or equal to 10 um (micrometer)
        in one cubic meter of air. "
    carbon_dioxide:
      Constraints:
      - display_name="Carbon Dioxide concentration"
      - units="ppm"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Carbon Dioxide concentration
      Notes: CO2
    nitrogen_dioxide:
      Constraints:
      - display_name="Nitrogen Dioxide concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Nitrogen Dioxide concentration
      Notes: NO2
    nitrogen_oxide:
      Constraints:
      - display_name="Nitrogen Oxide concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Nitrogen Oxide concentration
      Notes: "NO"
    sulphur_dioxide:
      Constraints:
      - display_name="Sulphur Dioxide concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Sulphur Dioxide concentration
      Notes: SO2
    ozone:
      Constraints:
      - display_name="Ozone concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Ozone concentration
      Notes: O3
    sky_type:
      Constraints:
      - display_name="Sky Type"
      - units="-"
      - value_type=INSTANTANEOUS
      # - values.Constraints="-"
      Type: "Group(TimeSeries)"
      Description: Sky Type
      Notes: CIE sky type, enumerated
    ammonia:
      Constraints:
      - display_name="Ammonia concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Ammonia concentration
      Notes: NH3
    carbon_monoxide:
      Constraints:
      - display_name="Carbon Monoxide concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Carbon Monoxide concentration
      Notes: CO
    formaldehyde:
      Constraints:
      - display_name="Formaldehyde"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Formaldehyde
      Notes: HCHO
    turbidity:
      Constraints:
      - display_name="Turbidity"
      - units=""
      - value_type=INSTANTANEOUS
      Type: "Group(TimeSeries)"
      Description: Turbidity
    lead:
      Constraints:
      - display_name="Lead concentration"
      - units="ug/m3"
      - value_type=INSTANTANEOUS
      - values.Constraints=">=0"
      Type: "Group(TimeSeries)"
      Description: Lead concentration
